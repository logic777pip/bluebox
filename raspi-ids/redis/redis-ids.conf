# 蓝队 IDS 用的 Redis 覆盖配置。
#
# 做法：**不替换**发行版的 /etc/redis/redis.conf，而是在它末尾加一行
#   include /etc/redis/redis-ids.conf
# 让本文件里的指令"后出现先赢"地覆盖发行版默认值。
# 理由和 Suricata 那边一样：发行版的默认值是和该版本配套验证过的，
# 整体替换会丢掉版本相关的必要设置。
#
# 本文件由安装脚本注入 __PASSWORD__ / __BIND__ 占位。

# ------------------------------------------------------------ 网络与安全
# 只监听本机 + 指定网段接口。**不要 bind 0.0.0.0**：
# Redis 历史上多次因暴露公网被入侵，而这里存的是全量告警流。
bind __BIND__
port 6379
protected-mode yes
# ⚠ 必须设密码：PC 侧跨网段连过来，明文端口 + 无认证 = 任何人可读全量告警
requirepass __PASSWORD__
# 空闲连接不主动断开（PC 侧用 BLOCK 长轮询，连接本来就会长时间不出声）
timeout 0
tcp-keepalive 60

# ------------------------------------------------------------ 内存上限
# Pi 4B 只有 4GB，且 Suricata 自己就要几百 MB，必须封顶。
# 与生产者侧的 XADD MAXLEN（默认 200000 条）配合：修剪在先，通常碰不到上限。
maxmemory 256mb
# ⚠ 策略必须是 noeviction，**不能用 allkeys-lru 之类**：
# 淘汰策略会在内存吃紧时**静默删掉**stream 里的数据（连消费组元数据一起），
# 表现为"随机丢事件"，而且没有任何报错。宁可写入失败（生产者会落 spool），
# 也不要静默丢数据。
maxmemory-policy noeviction
# stream 的组织参数：调小每个节点的条目数，降低小条目场景下的内存开销
stream-node-max-entries 100
stream-node-max-bytes 4096

# ------------------------------------------------------------ 持久化
# AOF 打开（everysec）：PC 侧长时间离线后回来仍能补上。
# 关掉 RDB 周期快照：Pi 上 fork 会造成明显抖动，而我们有 AOF 已足够。
appendonly yes
appendfsync everysec
save ""
# AOF 重写期间不要 fsync，避免 SD 卡抖动
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ------------------------------------------------------------ 省资源
# 慢日志：只留真正慢的（>50ms），便于发现 Pi 上的性能问题
slowlog-log-slower-than 50000
slowlog-max-len 64
# 关掉不需要的功能：完全不需要的持久化/复制相关开销
repl-diskless-sync yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
# 日志量降低（journald 里也不会被刷屏）
loglevel notice

# ------------------------------------------------------------ 危险命令
# 本项目只需要 XADD/XLEN/XRANGE/XREADGROUP/XACK/XPENDING/AUTH/PING。
# 把"一键清库"类命令禁掉：万一 PC 侧脚本写错、或有人摸到端口，
# 不至于把整条取证链抹掉。
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command DEBUG ""
# CONFIG 改名而非禁用，便于排障时仍可查看（需要知道新名字）
rename-command CONFIG "CONFIG_IDS_ONLY"
