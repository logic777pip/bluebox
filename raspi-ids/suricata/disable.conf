# suricata-update 的禁用清单：按**规则组**禁用，不按 sig_id 禁。
#
# 为什么要禁用：
#   ET Open 是通用规则集，全量启用在一个镜像口上会产生大量与本场景无关的告警。
#   告警量过大会把 PC 侧的 AI 研判配额（默认 3 次/分钟）打满，
#   于是真正需要研判的事件反而排不上队 —— 这是"告警疲劳"的机制性原因。
#
# ⚠ 这里**刻意只做保守的组级禁用**，不硬编码具体 sig_id：
#   凭空写一堆 SID 一般来自别的环境的经验，放到你的网络里可能正好把关键规则关掉了。
#   正确流程是「先跑、再按数据调」—— 用 verify_pi.sh --top-sigs 看真实的高频签名，
#   把确认无用的逐条加到这个文件里（下面有格式示例）。
#
# 用法：suricata-update 会自动读取 /etc/suricata/disable.conf

# ---- 被动（IDS）模式下的固定噪音 ----
# 这些是 IPS "阻断"规则。本系统是旁路只读，物理上无法阻断，
# 留着只会对每个命中包告警一遍。
group:emerging-drop.rules
group:emerging-drop
# 策略类规则（P2P、代理、软件更新等"违规"而非"入侵"），误报率极高
group:emerging-policy.rules
group:emerging-policy
# 纯信息类，没有处置价值
group:emerging-info.rules
group:emerging-info
# 已被上游删除/废弃的规则
group:emerging-deleted.rules
group:emerging-deleted

# ---- 按需追加（示例，去掉行首 # 生效）----
# 用 sig_id 精确禁用单条：
#   sid:2013031
# 用 msg 正则批量禁用（注意别写太宽）：
#   re:DNS query for (microsoft|windows|google)\.
# 启用某个组（如果默认清单误关了）：
#   enable:emerging-tor.rules
#
# 调优流程建议：
#   1) 先按现在的清单跑 2~3 天，别急着禁用；
#   2) ./verify_pi.sh --top-sigs 20  看最高频签名；
#   3) 对每条问一句"这条在这个网络里可能代表真实入侵吗"，
#      只有明确不可能（例如网络里根本没有该协议）才禁用；
#   4) 每次只加几条，观察 PC 侧 report 的告警量变化。
