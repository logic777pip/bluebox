# Suricata threshold / suppress 配置（/etc/suricata/threshold.config）
#
# 与 disable.conf 的分工：
#   disable.conf   —— 在"生成规则集"阶段整组剔除（根治）
#   threshold.conf —— 在"运行时"对单条规则限频或抑制（治标，但可应急）
#
# ⚠ 本文件默认**不抑制任何规则**。
#   刻意如此：抑制 = 主动放弃可见性，应该是看着数据做的决定，而不是预置的默认值。
#   下面全部是可直接启用的模板，按注释里的流程逐条放开。
#
# 语法提醒（三类，用途不同，别混用）：
#   suppress      —— 完全不再产生该规则的告警
#   threshold     —— "在 N 秒内出现 M 次才报"（降噪，但会不会漏掉单次攻击要自己判断）
#   rate_filter   —— "N 秒内超过 M 次就改变动作/限频"（通常用于扫描类）
#   三者都按 gen_id / sig_id 匹配；track 决定计数维度：
#     by_src / by_dst = 按对端 IP 分别计数（推荐）
#     by_both       = 按会话对计数
#
# ─────────────────────────────────────────────────────────────
# 【流程】先看数据，再决定抑制
#   ./verify_pi.sh --top-sigs 20
#   它会输出"最近 N 条告警里出现最多的签名 + 对应 sig_id"。
#   对每条问：这条规则在我的网络里，有可能代表真实入侵吗？
#     - 有可能        → 不动它。宁可多看几条，也别把眼睛闭上。
#     - 明确不可能    → 优先用 disable.conf 从规则集里去掉（更彻底、更省 CPU）
#     - 可能但太吵    → 用下面的方式限频，而不是彻底抑制
# ─────────────────────────────────────────────────────────────

# ---- 模板 1：限频。适合"真的可能是一次攻击，但同类告警太密"的规则 ----
# 示例：某条规则在 60 秒内同一源 IP 出现 5 次以上才报（单次不报）
# threshold gen_id 1, sig_id 2000000, type limit, track by_src, count 5, seconds 60

# ---- 模板 2：抑制单条。适合"确认与本网无关"的规则 ----
# suppress gen_id 1, sig_id 2000000

# ---- 模板 3：扫描类降噪。注意这会**降低扫描检测灵敏度**，只在扫描确实为常态时使用 ----
# threshold gen_id 1, sig_id 2000537, type both, track by_src, count 10, seconds 60

# ---- 与 PC 侧 AI 的配合（重要）----
# PC 侧的 bridge 有"同一指纹冷却"与限速，会再做一层降噪。
# 所以这里**不要**为了"减少 PC 侧打扰"而抑制：
# PC 侧的多维置信度已经把低置信告警降级为"只记录、不弹通知"了，
# 抑制掉就永远失去了把它交给 AI 判断的机会（也就无法事后回溯）。
# 这里只做"这条规则在本网络里根本不可能有意义"的取舍。
